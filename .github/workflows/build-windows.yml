name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nötig, um das Zip bei Tags an ein GitHub Release zu hängen

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout (inkl. Submodule, z.B. external/raylib)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Die CMakeLists.txt verlangt cmake_minimum_required(VERSION 4.0.0)
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: latest

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 1) RESOURCES_PATH ist in der CMakeLists.txt ein ABSOLUTER Pfad zum
      #    Quellordner. Auf dem Runner gäbe es den auf deinem PC nicht, also
      #    wird er durch einen relativen Pfad ersetzt (relativ zum Ordner,
      #    aus dem das Spiel gestartet wird).
      # 2) Designated initializers (.x = 1) brauchen unter MSVC C++20.
      #    Dauerhaft besser: set(CMAKE_CXX_STANDARD 20) direkt in der
      #    CMakeLists.txt, dann kann dieser Teil entfallen.
      - name: Patch CMakeLists.txt für den Windows-Release-Build
        shell: pwsh
        run: |
          $c = Get-Content CMakeLists.txt -Raw
          $c = $c.Replace('${CMAKE_CURRENT_SOURCE_DIR}/resources/', './resources/')
          $c = $c.Replace('set(CMAKE_CXX_STANDARD 17)', 'set(CMAKE_CXX_STANDARD 20)')
          Set-Content CMakeLists.txt $c -NoNewline
          Select-String -Path CMakeLists.txt -Pattern 'RESOURCES_PATH|CXX_STANDARD'

      # Eigener Build-Ordner "out", weil im Repo bereits ein "build/"-Ordner
      # liegt, dessen CMake-Cache sonst stören könnte.
      - name: Configure
        run: cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build out --parallel

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/rpg-mvp"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # Projektname in der CMakeLists.txt ist "animations"
          Copy-Item "out/animations.exe" "$dist/rpg-mvp.exe"
          Copy-Item "resources" "$dist/resources" -Recurse

          Compress-Archive -Path "$dist/*" -DestinationPath "rpg-mvp-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-mvp-windows
          path: rpg-mvp-windows.zip
          if-no-files-found: error

      - name: An GitHub Release anhängen (bei Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rpg-mvp-windows.zip
